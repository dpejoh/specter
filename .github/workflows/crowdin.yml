name: Crowdin Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # weekly: Monday 06:00 UTC
  push:
    branches: [main]
    paths: ['src/webroot/lang/source/string.json']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin-sync
  cancel-in-progress: true

jobs:
  upload-sources:
    # Pushing the English source file uploads it to Crowdin so translators
    # get the new keys immediately. Runs only on push, not on schedule.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_CROWDIN: ${{ secrets.CROWDIN_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Upload sources to Crowdin
        if: env.HAS_CROWDIN == 'true'
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  download-translations:
    # Weekly (and on demand) pull of finished translations as a PR.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      HAS_CROWDIN: ${{ secrets.CROWDIN_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download translations from Crowdin
        if: env.HAS_CROWDIN == 'true'
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          create_pull_request: true
          localization_branch_name: l10n_crowdin
          pull_request_title: 'i18n: translation updates from Crowdin'
          pull_request_body: 'Automated translation sync from [Crowdin](https://crowdin.com/project/specter-module).'
          pull_request_base_branch_name: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
